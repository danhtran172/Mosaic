<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mosaic Extension Settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
    <main class="glass-panel">
      <header>
        <span class="brand-mark" aria-hidden="true">I</span>
        <div><p class="eyebrow">MOSAIC EXTENSION</p><h1>Profile đích</h1></div>
        <span id="connection" class="connection" data-state="loading">Đang kiểm tra</span>
      </header>
      <p class="intro">Media bạn lưu từ web sẽ luôn vào profile này — kể cả khi không có cửa sổ Mosaic nào đang mở.</p>
      <section class="selection-card">
        <label for="profile">Lưu media vào Profile</label>
        <select id="profile" disabled><option>Đang tải profile…</option></select>
        <div class="actions"><button id="save" disabled>Lưu lựa chọn</button><button id="refresh" class="secondary" type="button">Thử lại</button></div>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
      <aside class="hint"><span aria-hidden="true">✦</span><p>Chỉ profile đã chọn <b>Default Library Location</b> mới xuất hiện tại đây. Tạo hoặc quản lý profile trong <b>Mosaic → Settings → Quản lý Profile</b>.</p></aside>
    </main>
    <script src="options.js"></script>
  </body>
</html>
